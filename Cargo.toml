[package]
name = "poker_tournament"
version = "0.1.0"
edition = "2021"
authors = ["Senior Systems Architect"]
description = "High-Performance Texas Hold'em 2-10 Player GTO Deep CFR Trainer, Solver & Live Assistant"
default-run = "train"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.28"
rfd = "0.15"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
enigo = { version = "0.3", default-features = false, features = ["x11rb"] }

[target.'cfg(not(all(unix, not(target_os = "macos"))))'.dependencies]
enigo = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
