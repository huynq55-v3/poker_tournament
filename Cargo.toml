[package]
name = "poker_tournament"
version = "0.1.0"
edition = "2021"
authors = ["Senior Systems Architect"]
description = "High-Performance Texas Hold'em 2-8 Player GTO Self-Play Simulator"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
