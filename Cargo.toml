[package]
name = "poker_tournament"
version = "0.1.0"
edition = "2021"
authors = ["Senior Systems Architect"]
description = "High-Performance Texas Hold'em 2-10 Player GTO Deep CFR Trainer, Solver & Live Assistant"
default-run = "train"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.28"
rfd = "0.15"
# Bot RL (transformer + PPO tự chơi). Tùy chọn để không làm chậm build bot hiện tại:
#   cargo run --release --features rl --bin train_rl
#   cargo run --release --features rl-cuda --bin train_rl   (GPU NVIDIA, vd. vast.ai)
burn = { version = "0.22.1", optional = true, default-features = false, features = ["std", "optim", "flex", "vulkan"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
enigo = { version = "0.3", default-features = false, features = ["x11rb"] }

[target.'cfg(not(all(unix, not(target_os = "macos"))))'.dependencies]
enigo = "0.3"

[[bin]]
name = "rl_gpu_check"
required-features = ["rl"]

[features]
rl = ["dep:burn"]
rl-cuda = ["rl", "burn/cuda"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
